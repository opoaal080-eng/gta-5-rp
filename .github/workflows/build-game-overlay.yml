name: Compile GTA5RP in-game menu dylib
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-game-overlay/**'
      - '.github/workflows/build-game-overlay.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile iPhone ARM64 library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.3 \
            -fobjc-arc -fmodules -O2 -dynamiclib \
            -install_name '@executable_path/Frameworks/libGTA5RPOverlay.dylib' \
            -framework Foundation -framework UIKit \
            -o artifact/libGTA5RPOverlay.dylib ios-game-overlay/RPOverlay.m
          file artifact/libGTA5RPOverlay.dylib
      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: GTA5RP-Overlay-ARM64
          path: artifact/libGTA5RPOverlay.dylib
          if-no-files-found: error
          retention-days: 14
